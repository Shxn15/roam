<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="night" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#2A3A78"/>
      <stop offset="1" stop-color="#141B3D"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.22" r="0.75">
      <stop offset="0" stop-color="#7C8BE0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7C8BE0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="planet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4D96"/>
      <stop offset="1" stop-color="#26346E"/>
    </linearGradient>
    <clipPath id="tile"><rect x="72" y="72" width="880" height="880" rx="200"/></clipPath>
  </defs>
  <rect x="72" y="72" width="880" height="880" rx="200" fill="url(#night)"/>
  <g clip-path="url(#tile)">
    <rect x="72" y="72" width="880" height="880" fill="url(#glow)"/>
    <!-- a little planet on the horizon -->
    <circle cx="512" cy="1490" r="760" fill="url(#planet)"/>
    <circle cx="512" cy="1490" r="760" fill="none" stroke="#5C6FC4" stroke-opacity="0.55" stroke-width="10"/>
    <!-- stars -->
    <g fill="#FFF6E6">
      <circle cx="236" cy="252" r="9" opacity="0.85"/>
      <circle cx="318" cy="176" r="5" opacity="0.6"/>
      <circle cx="808" cy="232" r="7" opacity="0.7"/>
      <circle cx="858" cy="420" r="5" opacity="0.5"/>
      <circle cx="176" cy="470" r="6" opacity="0.55"/>
      <circle cx="610" cy="150" r="5" opacity="0.5"/>
    </g>
    <!-- dotted flight path with a playful loop -->
    <path d="M140 846 C 330 836, 440 722, 424 612 C 410 506, 286 508, 300 598 C 314 690, 474 650, 546 506"
          fill="none" stroke="#CFC6FF" stroke-width="26" stroke-linecap="round" stroke-dasharray="0.1 52" opacity="0.95"/>
  </g>
  <!-- the plane -->
  <g transform="translate(668 372) rotate(42) scale(15.5) translate(-12 -12)">
    <path fill="#FFF8EC" stroke="#FFF8EC" stroke-width="0.9" stroke-linejoin="round"
          d="M12 1.6c.9 0 1.5.8 1.5 1.8V9.3l8.2 4.9c.3.2.5.5.5.9v.6c0 .4-.4.7-.8.6l-7.9-2.4v5.2l2.5 1.9c.2.1.3.4.3.6v.5c0 .3-.3.6-.6.5L12 21.7l-3.7 1c-.3.1-.6-.2-.6-.5v-.5c0-.2.1-.5.3-.6l2.5-1.9v-5.2l-7.9 2.4c-.4.1-.8-.2-.8-.6v-.6c0-.4.2-.7.5-.9l8.2-4.9V3.4c0-1 .6-1.8 1.5-1.8z"/>
  </g>
</svg>
