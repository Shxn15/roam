[package]
name = "roam"
version = "0.2.0"
description = "Roam – Reisen planen und träumen"
authors = ["Roam"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "roam_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
